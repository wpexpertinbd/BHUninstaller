[workspace]
resolver = "2"
members = ["crates/bhu-core", "crates/bhu-cli", "app/src-tauri"]

[workspace.package]
version = "0.2.10"
edition = "2021"
license = "MIT"
authors = ["BiswasHost <benjamin.biswas@gmail.com>"]
repository = "https://github.com/wpexpertinbd/BHUninstaller"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
thiserror = "2"
dirs = "6"
trash = "5"
